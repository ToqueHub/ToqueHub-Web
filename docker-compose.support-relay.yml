services:
  support-relay:
    build:
      context: .
      dockerfile: docker/support-relay.Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3100
      DATABASE_URL: ${SUPPORT_RELAY_DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_SUPPORT_CHAT_ID: ${TELEGRAM_SUPPORT_CHAT_ID}
      TELEGRAM_OPERATOR_IDS: ${TELEGRAM_OPERATOR_IDS}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      SUPPORT_RELAY_ADMIN_TOKEN: ${SUPPORT_RELAY_ADMIN_TOKEN}
    ports:
      - "${SUPPORT_RELAY_PORT:-3100}:3100"
