name: Publish Docker images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images
        env:
          TOQUEHUB_IMAGE_PLATFORMS: linux/arm64,linux/amd64
          TOQUEHUB_DOCKER_PUSH: "1"
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            latest="1"
          else
            version="$GITHUB_REF_NAME"
            latest="0"
          fi
          TOQUEHUB_IMAGE_VERSION="$version" TOQUEHUB_DOCKER_LATEST="$latest" TOQUEHUB_IMAGE_REGISTRY="ghcr.io/$owner" ./scripts/docker-publish.sh

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Images Docker multi-arch publiées pour cette version:

            - `${{ github.repository_owner }}/toquehub-api`
            - `${{ github.repository_owner }}/toquehub-web`
            - `${{ github.repository_owner }}/toquehub-updater`
