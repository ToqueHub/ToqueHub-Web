name: Publish Docker images

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release tag
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "${tag}")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "${tag} already targets ${tagged_commit}; increment package.json before releasing ${GITHUB_SHA}." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$tag" --message "ToqueHub ${version}"
            git push origin "$tag"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images
        env:
          TOQUEHUB_IMAGE_PLATFORMS: linux/arm64,linux/amd64
          TOQUEHUB_DOCKER_PUSH: "1"
          TOQUEHUB_IMAGE_VERSION: ${{ steps.release.outputs.version }}
          TOQUEHUB_DOCKER_LATEST: "1"
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          TOQUEHUB_IMAGE_REGISTRY="ghcr.io/$owner" ./scripts/docker-publish.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Images Docker multi-arch publiées pour cette version:

            - `${{ github.repository_owner }}/toquehub-api`
            - `${{ github.repository_owner }}/toquehub-web`
            - `${{ github.repository_owner }}/toquehub-mdns`
            - `${{ github.repository_owner }}/toquehub-updater`
