# METABEGIN
# X-Env-Layer-Name: toquehub-appliance
# X-Env-Layer-Category: application
# X-Env-Layer-Desc: ToqueHub Docker appliance files and first boot service.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: docker-debian-bookworm,systemd-net-min,systemd-timesyncd
# METAEND
---
mmdebstrap:
  packages:
    - avahi-daemon
    - cloud-guest-utils
    - curl
    - e2fsprogs
    - jq
    - libnss-mdns
    - openssl
    - python3
    - rsync
    - util-linux
    - udev
  customize-hooks:
    - $BDEBSTRAP_HOOKS/enable-units "$1" docker
    - $BDEBSTRAP_HOOKS/enable-units "$1" avahi-daemon
  cleanup-hooks:
    - $BDEBSTRAP_HOOKS/enable-units "$1" toquehub-grow-root
    - $BDEBSTRAP_HOOKS/enable-units "$1" toquehub-remote-agent
    - $BDEBSTRAP_HOOKS/enable-units "$1" toquehub-firstboot
