app = "toquehub-support-relay"
primary_region = "cdg"

[build]
  dockerfile = "../../docker/support-relay.Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3100"

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/v1/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
