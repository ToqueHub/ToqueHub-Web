services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toquehub}
      POSTGRES_USER: ${POSTGRES_USER:-toquehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${TOQUEHUB_DATA_DIR:-/var/lib/toquehub}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ${TOQUEHUB_CONFIG_DIR:-/etc/toquehub}/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${TOQUEHUB_DATA_DIR:-/var/lib/toquehub}/mosquitto/data:/mosquitto/data
      - ${TOQUEHUB_DATA_DIR:-/var/lib/toquehub}/mosquitto/log:/mosquitto/log

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:${ZIGBEE2MQTT_TAG:-latest}
    profiles: ["zigbee"]
    restart: unless-stopped
    depends_on:
      - mosquitto
    privileged: true
    ports:
      - "${ZIGBEE2MQTT_HTTP_PORT:-8081}:8080"
    environment:
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ${TOQUEHUB_DATA_DIR:-/var/lib/toquehub}/zigbee2mqtt:/app/data
      - /dev:/dev

  api:
    image: ${TOQUEHUB_IMAGE_REGISTRY:-ghcr.io/powarthy}/toquehub-api:${TOQUEHUB_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-toquehub}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-toquehub}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      BACKUP_CLOUD_ENCRYPTION_KEY: ${BACKUP_CLOUD_ENCRYPTION_KEY:?BACKUP_CLOUD_ENCRYPTION_KEY is required}
      BACKUP_DIR: /app/data/backups
      UPLOAD_DIR: /app/data/uploads
      HR_UPLOAD_DIR: /app/data/uploads/hr
      STOCKS_OCR_UPLOAD_DIR: /app/data/uploads/stocks-ocr
      HACCP_UPLOAD_DIR: /app/data/uploads/haccp
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      ZIGBEE2MQTT_BASE_TOPIC: ${ZIGBEE2MQTT_BASE_TOPIC:-zigbee2mqtt}
      ZIGBEE2MQTT_FRONTEND_URL: ${ZIGBEE2MQTT_FRONTEND_URL:-http://toquehub.local:8081}
      HACCP_SENSOR_OFFLINE_AFTER_MINUTES: ${HACCP_SENSOR_OFFLINE_AFTER_MINUTES:-30}
      HACCP_PAIRING_DURATION_SECONDS: ${HACCP_PAIRING_DURATION_SECONDS:-180}
      TOQUEHUB_DISCOVERY_ENABLED: ${TOQUEHUB_DISCOVERY_ENABLED:-true}
      TOQUEHUB_DISCOVERY_NAME: ${TOQUEHUB_DISCOVERY_NAME:-ToqueHub}
      TOQUEHUB_DISCOVERY_ORGANIZATION: ${TOQUEHUB_DISCOVERY_ORGANIZATION:-ToqueHub}
      TOQUEHUB_DISCOVERY_HOST: ${TOQUEHUB_DISCOVERY_HOST:-}
      TOQUEHUB_DISCOVERY_HTTPS: ${TOQUEHUB_DISCOVERY_HTTPS:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://toquehub.local:8080,http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - ${TOQUEHUB_DATA_DIR:-/var/lib/toquehub}/api:/app/data

  web:
    image: ${TOQUEHUB_IMAGE_REGISTRY:-ghcr.io/powarthy}/toquehub-web:${TOQUEHUB_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${TOQUEHUB_HTTP_PORT:-8080}:80"
